name: Calculator CI

on:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Build image and run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag calculator-ci .

      - name: Install dependencies and run unit tests
        run: >-
          docker run --rm calculator-ci
          bash -lc "pip install -r requirements.txt && python -m pytest"
